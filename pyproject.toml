[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-api"
version = "0.1.0"
description = "A small FastAPI and Supabase service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.115.0,<1",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "structlog>=25.1.0,<26",
    "uvicorn>=0.34.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.25.0,<2",
    "ruff>=0.11.0,<1",
    "ty>=0.0.1a16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/service_api"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["*_test.py"]
